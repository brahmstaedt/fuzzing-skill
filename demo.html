  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  :root[data-theme="dark"] { --bg:#151515; --fg:#ececea; --muted:#a3a39e; --card:#1f1f1e; --line:#33332f; --accent:#7fb5ec; --code:#2a2a28; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:920px; margin:0 auto; padding:48px 16px; display:grid; grid-template-columns:1fr minmax(240px,340px); gap:48px; align-items:center; }
  h1 { font-size:2rem; line-height:1.2; margin:0 0 28px; }
  ol { margin:0; padding-left:1.4em; display:grid; gap:20px; }
  li::marker { font-weight:700; color:var(--accent); }
  a { color:var(--accent); overflow-wrap:anywhere; }
  code { display:block; margin-top:8px; padding:12px 14px; background:var(--code); border-radius:8px;
         font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; overflow-wrap:anywhere; }
  figure { margin:0; text-align:center; }
  .qr { background:#fff; padding:16px; border-radius:16px; border:1px solid var(--line); }  /* white in both themes: scanners need contrast */
  .qr svg { display:block; width:100%; height:auto; }
  @media (max-width:700px) { main { grid-template-columns:1fr; gap:32px; padding-top:32px; } figure { max-width:300px; margin:0 auto; order:-1; } }
</style>
